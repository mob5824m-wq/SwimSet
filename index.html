<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SwimSet — swim practice maker</title>
  <meta name="description" content="Build, pace, save and run swim practices. Works offline on Debian, Android and Chromebooks." />
  <meta name="theme-color" content="#062a3a" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/builder" aria-label="SwimSet home">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <rect x="1" y="1" width="46" height="46" rx="12" fill="var(--brand-mark-bg, #062a3a)" stroke="var(--brand-mark-ring, #0ea5e9)" stroke-width="2"/>
        <path d="M8 30c4-6 8-6 12 0s8 6 12 0 5-4 8-1" fill="none" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M8 38c4-6 8-6 12 0s8 6 12 0 5-4 8-1" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" opacity=".65"/>
        <circle cx="17" cy="16" r="4" fill="#f8fafc"/>
        <path d="M22 22l8-4 7 3" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">
        <strong>SwimSet</strong>
        <span>practice maker</span>
      </span>
    </a>

    <nav class="nav" aria-label="Sections">
      <a class="nav-link" href="#/builder" data-nav="builder">Builder</a>
      <a class="nav-link" href="#/library" data-nav="library">Library<span class="nav-count" id="nav-count"></span></a>
      <a class="nav-link" href="#/pace" data-nav="pace">Pace</a>
      <a class="nav-link" href="#/run" data-nav="run">Poolside</a>
    </nav>

    <div class="top-actions">
      <button class="icon-btn install-btn" id="install-btn" data-action="install-app" hidden>
        <span class="install-label">Install</span>
      </button>
      <button class="icon-btn" data-action="toggle-theme" aria-label="Switch light or dark theme" title="Light / dark theme">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" data-action="open-help" aria-label="Help and install guide" title="Help">?</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="view" id="view-builder" data-view="builder" hidden></section>
    <section class="view" id="view-library" data-view="library" hidden></section>
    <section class="view" id="view-pace" data-view="pace" hidden></section>
    <section class="view view-run" id="view-run" data-view="run" hidden></section>
  </main>

  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="print-root" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">SwimSet needs JavaScript enabled. It runs entirely in your browser — nothing is uploaded.</div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
