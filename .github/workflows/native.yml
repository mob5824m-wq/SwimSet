name: Native apps

on:
  push:
    branches: [arena/d2542b1f-swimset]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libdbus-1-dev

      - name: Prepare native runners
        run: |
          mkdir -p ../ci-artifacts/logs
          rm -rf ../ci-artifacts/logs/*
          WINDOW_CC=linux/my_application.cc
          if [ -f linux/runner/my_application.cc ]; then WINDOW_CC=linux/runner/my_application.cc; fi
          sed -i -E 's/gtk_window_set_title\(window, "[^"]*"\)/gtk_window_set_title(window, "SwimSet")/' "$WINDOW_CC"
          sed -i -E 's/gtk_window_set_default_size\(window, [0-9]+, [0-9]+\)/gtk_window_set_default_size(window, 1220, 840)/' "$WINDOW_CC"
          sed -i -E 's/android:label="[^"]*"/android:label="SwimSet"/' android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/; s/minSdk = flutter.minSdkVersion/minSdk = 23/' "$f"
              sed -i -E 's/compileSdk(Version)? ?=? ?flutter.compileSdkVersion/compileSdk = 35/' "$f"
            fi
          done
          if ! grep -q suppressUnsupportedCompileSdk android/gradle.properties; then
            echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          fi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "branding/android/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: Fetch packages and analyze
        run: |
          flutter pub get 2>&1 | tee ../ci-artifacts/logs/pubget.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-artifacts/logs/analyze.log

      - name: Unit and widget tests
        run: |
          flutter test test/models_test.dart test/store_test.dart test/widget_test.dart 2>&1 \
            | tee ../ci-artifacts/logs/test.log

      - name: Render UI screenshots
        continue-on-error: true
        run: |
          flutter test test/screenshots_test.dart 2>&1 | tee ../ci-artifacts/logs/screens.log

      - name: Build Android APK
        run: flutter build apk --release 2>&1 | tee ../ci-artifacts/logs/apk.log

      - name: Build Linux desktop bundle
        run: flutter build linux --release 2>&1 | tee ../ci-artifacts/logs/linux.log

      - name: Package Debian
        run: bash tool/package_deb.sh 2.0.0 2>&1 | tee ../ci-artifacts/logs/deb.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p ../ci-artifacts/screens
          cp build/screens/*.png ../ci-artifacts/screens/ 2>/dev/null || true
          cp build/screens/layout-errors.txt ../ci-artifacts/screens/ 2>/dev/null || true
          if git -C .. log -1 --pretty=%B | grep -qF '[ship]'; then
            cp build/app/outputs/flutter-apk/app-release.apk ../ci-artifacts/swimset-2.0.0-universal.apk 2>/dev/null || true
            cp build/deb/swimset_2.0.0_amd64.deb ../ci-artifacts/ 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swimset-native
          path: ci-artifacts
          if-no-files-found: warn

      - name: Commit CI outputs to the branch
        if: always()
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-artifacts
          if git diff --cached --quiet; then
            echo "No CI output changes"
            exit 0
          fi
          git commit -m "CI: native build outputs [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
